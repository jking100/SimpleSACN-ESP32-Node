; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; https://flashgamer.com/blog/comments/solving-platformio-issues-with-the-adafruit-feather-s3

[platformio]
default_envs = adafruit_feather_esp32s3

;------------------------------------------
[env:adafruit_feather_esp32s3]
platform = espressif32
board = adafruit_feather_esp32s3
framework = arduino
lib_deps = 
	someweisguy/esp_dmx@^4.1.0
	adafruit/Adafruit NeoPixel@^1.15.5
test_ignore = *

build_type = debug

monitor_speed = 115200
monitor_filters = esp32_exception_decoder ; turns raw backtrace addrs into file:line against the elf
upload_port = COM3

build_flags =
    -DARDUINO_USB_MODE=1 ; this makes the thing auto go into download mode when i push to it

;------------------------------------------